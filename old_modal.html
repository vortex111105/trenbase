<!-- PRODUCT DETAIL MODAL (`prodModal`) -->
  <div id="prodModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onclick="closeProdModal(event)">
    <div class="bg-obsidian border border-white/10 rounded-[2.5rem] w-full max-w-2xl overflow-y-auto max-h-[90vh] shadow-2xl flex flex-col">
      <div class="flex items-center justify-between px-8 py-6 border-b border-white/10 sticky top-0 bg-obsidian/90 backdrop-blur-md z-10">
        <h3 id="pmTitle" class="text-lg font-bold text-white">Producto</h3>
        <button onclick="closeProdModalDirect()" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center text-white/60 hover:text-white transition">✕</button>
      </div>
      
      <div id="pmImgWrap" class="w-full aspect-[21/9] overflow-hidden bg-black/20"></div>

      <div class="p-8 space-y-6">
        <div class="flex items-baseline gap-4">
          <div id="pmScore" class="text-5xl font-extrabold text-white tracking-tight">97</div>
          <div class="text-xs text-white/40 font-mono uppercase">TrendScore</div>
          <span id="pmTag" class="tag tag-hot text-xs font-mono font-bold px-2 py-0.5 rounded uppercase">HOT</span>
        </div>

        <div class="flex border-b border-white/10 gap-4 mb-4">
          <button onclick="switchModalTab('info',this)" class="modal-tab py-2 text-xs font-bold text-champagne border-b-2 border-champagne">Información</button>
          <button onclick="switchModalTab('history',this)" class="modal-tab py-2 text-xs font-bold text-white/50 hover:text-white">Historial 90 días</button>
          <button onclick="switchModalTab('suppliers',this)" class="modal-tab py-2 text-xs font-bold text-white/50 hover:text-white">Proveedores</button>
          <button onclick="switchModalTab('marketing',this)" class="modal-tab py-2 text-xs font-bold text-white/50 hover:text-white flex items-center gap-1.5">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Marketing IA
          </button>
        </div>

        <!-- Info Tab -->
        <div id="tab-info" class="modal-tab-content active-section space-y-6">
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <div class="bg-white/5 border border-white/5 rounded-2xl p-4 text-center">
              <div id="pmChange" class="text-base font-bold text-champagne">+18%</div>
              <div class="text-[9px] text-white/40 uppercase font-mono mt-1">Cambio 24hs</div>
            </div>
            <div class="bg-white/5 border border-white/5 rounded-2xl p-4 text-center">
              <div id="pmMargin" class="text-base font-bold text-green-400">45-60%</div>
              <div class="text-[9px] text-white/40 uppercase font-mono mt-1">Margen est.</div>
            </div>
            <div class="bg-white/5 border border-white/5 rounded-2xl p-4 text-center">
              <div id="pmCat" class="text-base font-bold text-white">Tecnología</div>
              <div class="text-[9px] text-white/40 uppercase font-mono mt-1">Categoría</div>
            </div>
            <div class="bg-white/5 border border-white/5 rounded-2xl p-4 text-center">
              <div id="pmPrice" class="text-base font-bold text-white">$35 - $80</div>
              <div class="text-[9px] text-white/40 uppercase font-mono mt-1">Precio venta est.</div>
            </div>
            <div class="bg-white/5 border border-white/5 rounded-2xl p-4 text-center">
              <div id="pmComp" class="text-base font-bold text-white">Media</div>
              <div class="text-[9px] text-white/40 uppercase font-mono mt-1">Competencia</div>
            </div>
          </div>
