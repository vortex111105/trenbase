<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrendBase - Descubre Productos Ganadores</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            bgmain: '#F4F5F7',
          }
        }
      }
    }
  </script>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    
    .saas-shadow {
      box-shadow: 0 0 30px rgba(0,0,0,0.06), 0 4px 6px -1px rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.04);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .glow-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(0,0,0,0.2);
    }

    /* Abstract background gradient */
    .hero-bg {
      background: radial-gradient(circle at 50% -20%, #E8F0FE 0%, transparent 50%),
                  radial-gradient(circle at -20% 50%, #FFF5E1 0%, transparent 40%),
                  radial-gradient(circle at 120% 80%, #FCE8E8 0%, transparent 40%);
    }
  </style>
</head>
<body class="bg-bgmain text-gray-900 min-h-screen flex flex-col hero-bg relative">

  <!-- Navbar -->
  <nav class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center relative z-20">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center saas-shadow">
        <i data-lucide="zap" class="w-5 h-5 text-white"></i>
      </div>
      <span class="text-xl font-extrabold tracking-tight">TrendBase</span>
    </div>
    
    <div class="flex items-center gap-6">
      <a href="#" class="text-sm font-medium text-gray-500 hover:text-black transition">Características</a>
      <a href="#" class="text-sm font-medium text-gray-500 hover:text-black transition">Precios</a>
      <a href="dashboard.html" class="bg-white px-6 py-2.5 rounded-full text-sm font-bold saas-shadow hover:shadow-lg transition">Ingresar</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="flex-1 flex flex-col items-center justify-center text-center px-6 relative z-20 pb-20">
    
    <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white saas-shadow mb-8 border border-gray-100">
      <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
      <span class="text-xs font-bold text-gray-600 uppercase tracking-widest">Plataforma Activa</span>
    </div>

    <h1 class="text-5xl md:text-7xl font-black tracking-tight leading-tight max-w-4xl">
      Descubre tendencias <br class="hidden md:block">
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-gray-900 to-gray-400">antes que nadie.</span>
    </h1>
    
    <p class="mt-6 text-lg md:text-xl text-gray-500 max-w-2xl font-medium">
      El motor de inteligencia que analiza millones de datos para encontrar los productos ganadores de Dropshipping y E-commerce en tiempo real.
    </p>

    <div class="mt-10 flex flex-col sm:flex-row gap-4 items-center">
      <a href="dashboard.html" class="glow-button bg-black text-white px-8 py-4 rounded-full text-lg font-bold flex items-center gap-3 transition">
        Entrar al Dashboard <i data-lucide="arrow-right" class="w-5 h-5"></i>
      </a>
      <a href="#demo" class="px-8 py-4 rounded-full text-lg font-bold text-gray-600 hover:text-black transition">
        Ver Demo
      </a>
    </div>

    <!-- Floating UI Mockup to give context -->
    <div class="mt-20 relative max-w-5xl w-full">
      <div class="absolute inset-0 bg-gradient-to-b from-transparent to-bgmain z-10 rounded-[2rem]"></div>
      <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80" alt="Dashboard Preview" class="rounded-[2rem] saas-shadow border-4 border-white opacity-80 mix-blend-luminosity">
    </div>

  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
